<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>
<style>
body{font-family:Arial,sans-serif;max-width:500px;margin:60px auto;padding:20px}
input,textarea{width:100%;padding:10px;margin:8px 0 16px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
button{background:#4CAF50;color:white;padding:12px;border:none;border-radius:4px;cursor:pointer;width:100%;font-size:16px}
#response{margin-top:20px;padding:10px;border-radius:4px;display:none;background:#d4edda;color:#155724}
</style>
</head>
<body>
<h2>Get In Touch</h2>
<form id="leadForm">
<label>Name</label><input type="text" name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Phone</label><input type="tel" name="phone">
<label>Message</label><textarea name="message" rows="4"></textarea>
<button type="submit">Send Message</button>
</form>
<div id="response"></div>
<script>
document.getElementById('leadForm').addEventListener('submit',async function(e){
e.preventDefault();
const res=await fetch('/submit',{method:'POST',body:new FormData(this)});
const data=await res.json();
const r=document.getElementById('response');
r.textContent=data.message;
r.style.display='block';
this.reset();
});
</script>
</body>
</html>
